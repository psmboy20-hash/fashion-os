<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALLINCREW Fashion OS</title>
<style>
  body{margin:0;font:15px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#333;background:#fff}
  #boot{max-width:420px;margin:28vh auto 0;padding:0 16px;text-align:center}
  #boot b{display:block;font-size:17px;margin-bottom:6px}
  #boot a{color:#2c5d8f}
</style>
</head>
<body>
<div id="boot"><b>ALLINCREW Fashion OS</b><span id="bootmsg">불러오는 중…</span></div>

<script id="gas-shim">
/* google.script.run 대신, 구글 로그인 없이 Apps Script(doPost)를 부르는 통로 */
(function () {
  var API = "https://script.google.com/macros/s/AKfycbzJJ4zE4KlVUe-lfcmsl11I0q6hqubvGCkBLmVPXXScPRKOwICnlYCeh7wYAECYpGWa/exec";
  function post(fn, args) {
    return fetch(API, {
      method: "POST",
      credentials: "omit", // 구글 로그인 쿠키를 보내지 않음 → 계정이 여러 개여도 상관없음
      headers: { "Content-Type": "text/plain;charset=utf-8" }, // 사전 확인 요청 없이 보내기
      body: JSON.stringify({ __webapi: 1, fn: fn, args: args })
    }).then(function (r) {
      if (!r.ok) throw new Error("서버 응답 " + r.status);
      return r.json();
    }).then(function (d) {
      if (!d.ok) throw new Error(d.error || "서버 오류");
      return d.value;
    });
  }
  function runner(ok, fail, user) {
    return new Proxy({}, {
      get: function (_, name) {
        if (name === "withSuccessHandler") return function (h) { return runner(h, fail, user); };
        if (name === "withFailureHandler") return function (h) { return runner(ok, h, user); };
        if (name === "withUserObject") return function (o) { return runner(ok, fail, o); };
        if (typeof name !== "string") return undefined;
        return function () {
          var args = Array.prototype.slice.call(arguments);
          post(name, args).then(
            function (v) { if (ok) ok(v, user); },
            function (e) { if (fail) fail(e, user); else console.error(e); }
          );
        };
      }
    });
  }
  window.__gasPost = post;
  window.google = { script: {
    run: runner(),
    host: { origin: location.origin, close: function () {}, setHeight: function () {}, setWidth: function () {}, editor: { focus: function () {} } },
    url: { getLocation: function (cb) { cb({ hash: location.hash.slice(1), parameter: {}, parameters: {} }); } }
  } };
})();
</script>

<script>
/* 앱 화면 HTML을 받아 이 페이지에 그대로 그림 (앱 내용이 바뀌어도 이 파일은 고칠 필요 없음) */
(function () {
  var shim = document.getElementById("gas-shim").textContent;
  window.__gasPost("__page__", []).then(function (html) {
    var tag = "<script>" + shim + "<\/script>";
    var head = /<head(\s[^>]*)?>/i;
    html = head.test(html) ? html.replace(head, function (m) { return m + tag; }) : tag + html;
    document.open();
    document.write(html);
    document.close();
  }).catch(function (e) {
    document.getElementById("bootmsg").innerHTML =
      "앱을 불러오지 못했어요: " + String((e && e.message) || e).replace(/</g, "&lt;") +
      '<br><a href="">다시 시도</a>';
  });
})();
</script>
</body>
</html>
